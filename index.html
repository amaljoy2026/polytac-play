<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>PolyTac</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #050b18;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2691860,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	<!-- PolyTac loader watchdog, injected by .github/workflows/web.yml before
     </body>. Godot's web loader never reports some failures: a download that
     stalls, or the engine failing to start (iOS Safari short of memory after
     a few reloads). The progress bar then sits there forever. This watches
     the bar; if the game hasn't started and the bar hasn't moved for
     STUCK_MS, or the loader shows its own error, it offers a Retry button. -->
<style>
#pt-stuck { position: absolute; left: 0; right: 0; bottom: 18%; display: none;
	flex-direction: column; align-items: center; gap: 0.8rem; z-index: 2;
	font-family: -apple-system, 'Noto Sans', Arial, sans-serif; color: #cfe9ff;
	text-align: center; padding: 0 2rem; }
#pt-stuck button { font-size: 1.2rem; padding: 0.7rem 2.4rem; border-radius: 2rem;
	border: 2px solid #5fd4ff; background: #0e1a33; color: #5fd4ff; }
#pt-stuck small { opacity: 0.7; }
</style>
<div id="pt-stuck">
	<div>Loading got stuck.</div>
	<button type="button" id="pt-retry">Retry</button>
	<small>If it keeps happening, close this tab and open the link again.</small>
</div>
<script>
(function () {
	const STUCK_MS = 15000;
	const box = document.getElementById('pt-stuck');
	document.getElementById('pt-retry').addEventListener('click', function () {
		const url = new URL(window.location.href);
		url.searchParams.set('retry', Date.now().toString());
		window.location.replace(url.toString());
	});
	function show(why) {
		if (box.style.display === 'flex') {
			return;
		}
		console.warn('PolyTac loader: ' + why);
		box.style.display = 'flex';
	}
	// errors the loader swallows (its promises have no catch)
	window.addEventListener('unhandledrejection', function (e) {
		if (document.getElementById('status')) {
			show('unhandled rejection: ' + (e.reason && e.reason.message || e.reason));
		}
	});
	let last = '';
	let since = Date.now();
	const timer = setInterval(function () {
		const status = document.getElementById('status');
		// the loader removes its overlay once the game is running
		if (!status) {
			clearInterval(timer);
			box.style.display = 'none';
			return;
		}
		const notice = document.getElementById('status-notice');
		if (notice && notice.style.display === 'block') {
			show('loader error');
			return;
		}
		const bar = document.getElementById('status-progress');
		const now = bar ? bar.value + '/' + bar.max : '';
		if (now !== last) {
			last = now;
			since = Date.now();
		} else if (Date.now() - since > STUCK_MS) {
			show('no progress for ' + STUCK_MS + ' ms at ' + now);
		}
	}, 1000);
})();
</script>

</body>
</html>
